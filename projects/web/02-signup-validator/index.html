<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signup Validator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101828;font-family:system-ui;color:white}.box{width:min(92%,420px);background:#1d2939;padding:28px;border-radius:22px}h1{margin-top:0}label{display:block;margin:14px 0 6px;color:#d0d5dd}input{width:100%;padding:12px;border:1px solid #475467;border-radius:10px;background:#101828;color:white}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#fff;color:#101828;font-weight:700}.msg{min-height:22px;margin-top:12px;color:#fda29b}.ok{color:#6ce9a6}</style></head><body><form class="box" id="form"><h1>Create account</h1><label>Name</label><input id="name" required minlength="2"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="pass" type="password" required minlength="8"><button>Validate</button><div id="msg" class="msg"></div></form><script>const form=document.querySelector('#form'),msg=document.querySelector('#msg');form.addEventListener('submit',e=>{e.preventDefault();const pass=document.querySelector('#pass').value;const strong=/[A-Z]/.test(pass)&&/[0-9]/.test(pass);if(!strong){msg.className='msg';msg.textContent='Use at least one uppercase letter and one number.';return}msg.className='msg ok';msg.textContent='Looks good — form is valid.'})</script></body></html>
