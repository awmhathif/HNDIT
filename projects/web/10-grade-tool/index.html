<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Grade Tool</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;font-family:system-ui;color:#0f172a}.app{width:min(900px,calc(100% - 28px));margin:60px auto}.bar{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:11px;border-radius:10px;border:1px solid #cbd5e1}input{flex:1;min-width:150px}button{background:#0f172a;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:22px;background:white}th,td{text-align:left;padding:13px;border-bottom:1px solid #e2e8f0}.summary{display:flex;gap:10px;margin-top:16px}.chip{background:#e2e8f0;padding:9px 12px;border-radius:999px}</style></head><body><main class="app"><h1>Student grade tool</h1><form id="form" class="bar"><input id="name" placeholder="Student name" required><input id="mark" type="number" min="0" max="100" placeholder="Mark" required><button>Add student</button></form><table><thead><tr><th>Name</th><th>Mark</th><th>Grade</th></tr></thead><tbody id="rows"></tbody></table><div class="summary" id="summary"></div></main><script>const students=[];function grade(m){return m>=75?'A':m>=65?'B':m>=55?'C':m>=40?'S':'F'}function render(){const rows=document.querySelector('#rows');rows.innerHTML='';students.forEach(s=>{const tr=document.createElement('tr');[s.name,s.mark,grade(s.mark)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});rows.append(tr)});const avg=students.length?students.reduce((a,s)=>a+s.mark,0)/students.length:0;document.querySelector('#summary').innerHTML='<span class="chip">Students: '+students.length+'</span><span class="chip">Average: '+avg.toFixed(1)+'</span>'}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const n=document.querySelector('#name'),m=document.querySelector('#mark');students.push({name:n.value.trim(),mark:+m.value});n.value='';m.value='';render()};render()</script></body></html>
