<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Switcher</title><style>:root{--bg:#f6f7fb;--card:#fff;--text:#18181b;--muted:#71717a;--accent:#4f46e5}[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#818cf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui;transition:.2s}.card{width:min(92%,560px);background:var(--card);padding:34px;border-radius:24px}p{color:var(--muted);line-height:1.7}button{border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:white;font-weight:700}</style></head><body><article class="card"><h1>Persistent themes</h1><p>This small project uses CSS variables for theming and localStorage to remember the selected mode after refresh.</p><button id="toggle">Switch theme</button></article><script>const root=document.documentElement,key='hndit-theme';root.dataset.theme=localStorage.getItem(key)||'light';document.querySelector('#toggle').onclick=()=>{root.dataset.theme=root.dataset.theme==='light'?'dark':'light';localStorage.setItem(key,root.dataset.theme)}</script></body></html>
