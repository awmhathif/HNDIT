<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile Card</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:system-ui;color:#18202a}.card{width:min(92%,380px);background:white;border:1px solid #e4e8ee;border-radius:24px;padding:28px;box-shadow:0 18px 50px #14213d12}.avatar{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:#111827;color:white;font-size:28px;font-weight:700}.eyebrow{margin:20px 0 6px;color:#667085;font-size:13px;text-transform:uppercase;letter-spacing:.12em}h1{margin:0;font-size:28px}p{color:#667085;line-height:1.6}.skills{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.skills span{background:#f2f4f7;border-radius:999px;padding:7px 10px;font-size:13px}a{display:block;text-align:center;text-decoration:none;background:#111827;color:#fff;padding:12px;border-radius:12px;font-weight:650}</style></head><body><article class="card"><div class="avatar">AH</div><div class="eyebrow">Student developer</div><h1>Awm Hathif</h1><p>A compact responsive profile card built as a semantic HTML and CSS layout exercise.</p><div class="skills"><span>HTML</span><span>CSS</span><span>Responsive UI</span></div><a href="mailto:hello@example.com">Contact</a></article></body></html>
