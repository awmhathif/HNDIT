<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;font-family:system-ui}.calc{width:min(92%,340px);background:#1f2937;padding:18px;border-radius:24px}.display{min-height:92px;color:white;text-align:right;padding:20px 8px;font-size:38px;overflow:auto}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{aspect-ratio:1;border:0;border-radius:16px;background:#374151;color:#fff;font-size:20px;cursor:pointer}.op{background:#4b5563}.eq{background:#f9fafb;color:#111827}.wide{grid-column:span 2;aspect-ratio:auto}</style></head><body><div class="calc"><div id="display" class="display">0</div><div class="keys"><button data-a="clear" class="op">C</button><button data-v="(" class="op">(</button><button data-v=")" class="op">)</button><button data-v="/" class="op">÷</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="*" class="op">×</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="-" class="op">−</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="+" class="op">+</button><button data-v="0" class="wide">0</button><button data-v=".">.</button><button data-a="equals" class="eq">=</button></div></div><script>let expr='';const d=document.querySelector('#display');function show(){d.textContent=expr||'0'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.a==='clear')expr='';else if(b.dataset.a==='equals'){try{if(!/^[0-9+\-*/().\s]+$/.test(expr))throw 0;expr=String(Function('return ('+expr+')')())}catch{expr='Error'}}else{if(expr==='Error')expr='';expr+=b.dataset.v}show()});addEventListener('keydown',e=>{if('0123456789+-*/().'.includes(e.key)){expr+=e.key;show()}if(e.key==='Enter')document.querySelector('[data-a=equals]').click();if(e.key==='Escape')document.querySelector('[data-a=clear]').click()})</script></body></html>
