<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Splitter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ecfdf3;font-family:system-ui;color:#102a1b}.card{width:min(92%,450px);background:white;padding:28px;border-radius:24px;box-shadow:0 20px 50px #16653414}label{display:block;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #bbd7c5;border-radius:10px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#166534;color:white;font-weight:700}.result{margin-top:20px;background:#f0fdf4;padding:16px;border-radius:14px;font-size:18px}.big{font-size:34px;font-weight:800}</style></head><body><form class="card" id="form"><h1>Split a bill</h1><label>Bill total</label><input id="bill" type="number" min="0" step="0.01" value="120"><label>People</label><input id="people" type="number" min="1" value="4"><label>Tip %</label><input id="tip" type="number" min="0" value="10"><button>Calculate</button><div id="result" class="result"></div></form><script>function calc(){const bill=+document.querySelector('#bill').value,people=+document.querySelector('#people').value,tip=+document.querySelector('#tip').value;if(bill<0||people<1||tip<0)return;const total=bill*(1+tip/100),each=total/people;document.querySelector('#result').innerHTML='<div>Total: $'+total.toFixed(2)+'</div><div class="big">$'+each.toFixed(2)+'</div><div>per person</div>'}document.querySelector('#form').onsubmit=e=>{e.preventDefault();calc()};calc()</script></body></html>
