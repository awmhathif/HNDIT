<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local To-do</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f7f8;font-family:system-ui;color:#18181b}.app{width:min(680px,calc(100% - 28px));margin:70px auto}h1{font-size:40px}.add{display:flex;gap:8px}input{flex:1;padding:13px;border:1px solid #d4d4d8;border-radius:12px}button{border:0;border-radius:12px;padding:12px 15px;background:#18181b;color:white;cursor:pointer}.filters{display:flex;gap:8px;margin:18px 0}.filters button{background:#e4e4e7;color:#18181b}.filters .active{background:#18181b;color:white}ul{list-style:none;padding:0}.task{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e4e4e7;padding:14px;border-radius:14px;margin:9px 0}.task span{flex:1}.done span{text-decoration:line-through;color:#a1a1aa}.del{background:transparent;color:#71717a;padding:5px}</style></head><body><main class="app"><h1>Today</h1><form class="add" id="form"><input id="input" placeholder="Add a task" required><button>Add</button></form><div class="filters"><button data-f="all" class="active">All</button><button data-f="open">Open</button><button data-f="done">Done</button></div><ul id="list"></ul></main><script>let tasks=JSON.parse(localStorage.getItem('hndit-tasks')||'[]'),filter='all';const list=document.querySelector('#list');function save(){localStorage.setItem('hndit-tasks',JSON.stringify(tasks));render()}function render(){list.innerHTML='';tasks.filter(t=>filter==='all'||(filter==='done'&&t.done)||(filter==='open'&&!t.done)).forEach(t=>{const li=document.createElement('li');li.className='task '+(t.done?'done':'');const c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.onchange=()=>{t.done=c.checked;save()};const s=document.createElement('span');s.textContent=t.text;const d=document.createElement('button');d.className='del';d.textContent='Delete';d.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save()};li.append(c,s,d);list.append(li)})}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('#input');tasks.unshift({id:Date.now(),text:i.value.trim(),done:false});i.value='';save()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));render()});render()</script></body></html>
