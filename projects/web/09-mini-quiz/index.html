<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Quiz</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;font-family:system-ui;color:#292524}.card{width:min(92%,560px);background:white;border:1px solid #fed7aa;border-radius:24px;padding:30px}.meta{color:#9a3412;font-size:13px;font-weight:700}.answers{display:grid;gap:10px;margin-top:22px}button{padding:13px;text-align:left;border:1px solid #fdba74;border-radius:12px;background:#fff7ed;cursor:pointer}.result{font-size:34px;font-weight:800}</style></head><body><main class="card" id="app"></main><script>const q=[['Which HTML element contains the main page content?',['<main>','<meta>','<style>'],0],['Which CSS layout is two-dimensional?',['Flexbox','Grid','Float'],1],['Which keyword creates a variable that can be reassigned?',['const','let','class'],1],['What does DOM mean?',['Data Object Map','Document Object Model','Display Output Method'],1]];let i=0,score=0;const app=document.querySelector('#app');function render(){if(i>=q.length){app.innerHTML='<div class="meta">COMPLETE</div><p class="result">'+score+' / '+q.length+'</p><button onclick="location.reload()">Try again</button>';return}const [text,answers]=q[i];app.innerHTML='<div class="meta">QUESTION '+(i+1)+' OF '+q.length+'</div><h1>'+text+'</h1><div class="answers">'+answers.map((a,n)=>'<button data-i="'+n+'">'+a.replace(/</g,'&lt;')+'</button>').join('')+'</div>';app.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.i===q[i][2])score++;i++;render()})}render()</script></body></html>
