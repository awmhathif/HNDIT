<!DOCTYPE html>
<html>
<head>
  <title>Sample Form</title>
</head>
<body bgcolor="lightgreen">

  <h2>Form Activity</h2>

  <form>

    <label>First Name:</label>
    <input type="text" name="firstName" value="Mohamed"><br><br>

    <label>Last Name:</label>
    <input type="text" name="lastName" value="Hathif"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male" checked> Male<br>
    <input type="radio" name="gender" value="female"> Female<br><br>

    <label>Choose your favorite food:</label><br>
    <input type="checkbox" name="food" value="Biriyani" checked> Biriyani<br>
    <input type="checkbox" name="food" value="Burger" > Burger<br>
    <input type="checkbox" name="food" value="pizza"> Pizza<br><br>

    <label>Your favourite quote:</label><br>
    <textarea name="quote">Time doesn't heal anything; it just teaches us how to live with pain :)</textarea><br><br>

    <label>Select Level of Education:</label><br>
    <select name="level">
      <option value="Diploma">Diploma</option>
      <option value="HigherNationalDiploma" selected>Higher National Diploma</option>
      <option value="BachelorDegree">Bachelor Degree</option>
      <option value="Degree">Degree</option>
    </select><br><br>

    <label>Select Your Favorite time of the day:</label><br>
    <select name="timeOfDay" size="1">
      <option value="morning">Morning</option>
      <option value="Evening">Evening</option>
      <option value="night" selected>Night</option>
    </select><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>

</body>
</html>
